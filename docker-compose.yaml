services:
  # ─── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moalog-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Rate Limiter ──────────────────────────────────────
  rate-limiter:
    build:
      context: ../distributed-rate-limiter
      dockerfile: Dockerfile
    container_name: moalog-rate-limiter
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACTUATOR_USER: ${ACTUATOR_USER:-actuator}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:-admin}
    ports:
      - "${RATE_LIMITER_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ─── MySQL ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: moalog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-moalog_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retrospect}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-moalog_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── moalog-server ───────────────────────────────────
  moalog-server:
    build:
      context: ./codes/server
      dockerfile: Dockerfile
    container_name: moalog-server
    depends_on:
      mysql:
        condition: service_healthy
      rate-limiter:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-moalog_local}@mysql:3306/${MYSQL_DATABASE:-retrospect}
      DB_SCHEMA_UPDATE: "true"
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-1209600}
      SIGNUP_TOKEN_EXPIRATION: ${SIGNUP_TOKEN_EXPIRATION:-600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      PDF_FONT_DIR: /app/fonts
      PDF_FONT_FAMILY: NanumGothic
      RATE_LIMITER_URL: http://rate-limiter:8080
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      RUST_LOG: ${RUST_LOG:-info,server=debug}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q healthy'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ─── Prometheus ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: moalog-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      moalog-server:
        condition: service_healthy
      rate-limiter:
        condition: service_healthy
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: moalog-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
