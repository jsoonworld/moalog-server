global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'moalog-server'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['moalog-server:8080']

  - job_name: 'rate-limiter'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['rate-limiter:8080']
    basic_auth:
      username: actuator
      password: admin

  - job_name: 'fluxpay-engine'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['fluxpay-engine:8080']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'rjmx-rate-limiter'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['rjmx-exporter-rate-limiter:9090']

  - job_name: 'rjmx-fluxpay'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['rjmx-exporter-fluxpay:9090']
